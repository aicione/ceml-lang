[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ceml-lang"
version = "0.1.0"
description = "Circuit Engineering Markup Language for AI.ciOne"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
render = [
    "schemdraw>=0.20",
    "matplotlib>=3.8",
]


[project.scripts]
ceml = "ceml.cli:main"

[tool.setuptools.packages.find]
include = ["ceml*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
